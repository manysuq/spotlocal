version: '3.8'

services:
  spotlocal:
    image: alpine:latest
    container_name: spotlocal
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - /:/host
      - ./music:/home/alarm/.gemini/antigravity-cli/scratch/spotlocal/music
      - ./data:/home/alarm/.gemini/antigravity-cli/scratch/spotlocal/data
    environment:
      - SPOTLOCAL_HOST=0.0.0.0
      - SPOTLOCAL_PORT=8000
    command: ["chroot", "/host", "sh", "-c", "cd /home/alarm/.gemini/antigravity-cli/scratch/spotlocal && python3 -m app.main"]
