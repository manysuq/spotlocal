version: '3.8'

services:
  spotlocal:
    build: .
    container_name: spotlocal
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      # Mount your local music library here
      - ./music:/app/music
      # Mount application database and cover art cache
      - ./data:/app/data
    environment:
      - SPOTLOCAL_HOST=0.0.0.0
      - SPOTLOCAL_PORT=8000
      - SPOTLOCAL_AUDIO_FORMAT=mp3
      # Optional: Spotify API credentials for faster spotDL rate limits
      # - SPOTIFY_CLIENT_ID=your_client_id_here
      # - SPOTIFY_CLIENT_SECRET=your_client_secret_here
